name: CI

on:
  push:
    branches: [dev, main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Verify
        run: bun run verify

      - name: Audit dependencies
        run: bun run security:audit

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser smoke
        run: bun run test:e2e

      - name: High DPI rendering
        env:
          RENDER_BASE_URL: http://127.0.0.1:4173
        run: bunx playwright test --config playwright.render.config.ts --project chromium-retina --grep '冷加载|主题'
