name: CI

on:
  push:
    branches: [dev, main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  runtime-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun ci
      - run: bun run type-build:runtime
      - run: bun run build:runtime
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run test:e2e:runtime --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.browser }}
          path: |
            node_modules/.cache/runtime-regression-results.json
            test-results/
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Verify
        run: bun run verify

      - name: Audit dependencies
        run: bun run security:audit

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser smoke
        run: bun run test:e2e

      - name: High DPI rendering
        env:
          RENDER_BASE_URL: http://127.0.0.1:4173
        run: bunx playwright test --config playwright.render.config.ts --project chromium-retina --grep '冷加载|主题'
